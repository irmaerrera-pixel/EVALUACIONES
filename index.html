<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captura de Evaluaciones — CETis 42</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #ffffff;
    --tinta: #14213d;
    --tinta-suave: #51608a;
    --papel-linea: #c9d0e0;
    --laton: #14213d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--papel);
    color: var(--tinta);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 48px 24px;
  }
  .contenedor {
    max-width: 420px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 40px;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.03em;
    color: var(--tinta-suave);
    margin: 0 0 10px;
  }
  h1 {
    font-family: 'Lora', Georgia, serif;
    font-weight: 600;
    font-size: 27px;
    margin: 0;
    line-height: 1.3;
  }
  .tarjeta {
    border: 1px solid var(--papel-linea);
    border-radius: 4px;
    padding: 26px 24px;
  }
  .tarjeta h2 {
    font-family: 'Lora', Georgia, serif;
    font-weight: 600;
    font-size: 18px;
    margin: 0 0 10px;
  }
  .tarjeta p {
    font-size: 14px;
    color: var(--tinta-suave);
    line-height: 1.5;
    margin: 0 0 20px;
  }
  .boton {
    display: inline-block;
    width: 100%;
    text-align: center;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    font-size: 14.5px;
    text-decoration: none;
    padding: 12px 20px;
    border-radius: 3px;
    box-sizing: border-box;
  }
  .boton-primario { color: #ffffff; background: var(--tinta); }
  .boton-primario:hover { background: #0d1730; }
  .nota {
    margin-top: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--tinta-suave);
  }
</style>
</head>
<body>
  <div class="contenedor">
    <header>
      <p class="eyebrow">CETis No. 42 — Ignacio López Rayón</p>
      <h1>Captura de Evaluaciones por Actividad</h1>
    </header>

    <div class="tarjeta">
      <h2>Ya tengo acceso</h2>
      <p>Docentes: capturas calificaciones, generas concentrados y administras grupos. Alumnos: consultas tu propio estatus.</p>
      <a class="boton boton-primario" href="https://script.google.com/a/macros/cetis42.edu.mx/s/AKfycbxNZpiJwcaULs6IVSJTCH-am5g3FI0XmGO_-9s4M-2kY0Ehse2sfP-OeN1MO0oM6wGW/exec" target="_blank" rel="noopener">Abrir aplicación</a>
      <p class="nota">Entra con tu cuenta de Google institucional</p>
    </div>
  </div>
</body>
</html>
