<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captura de Evaluaciones — CETis 42</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #ffffff;
    --tinta: #14213d;
    --tinta-suave: #51608a;
    --papel-linea: #c9d0e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--papel);
    color: var(--tinta);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 24px;
  }
  .tarjeta {
    max-width: 420px;
    text-align: center;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.03em;
    color: var(--tinta-suave);
    margin: 0 0 10px;
  }
  h1 {
    font-family: 'Lora', Georgia, serif;
    font-weight: 600;
    font-size: 26px;
    margin: 0 0 14px;
    line-height: 1.3;
  }
  p.descripcion {
    font-size: 15px;
    color: var(--tinta-suave);
    line-height: 1.5;
    margin: 0 0 28px;
  }
  .boton {
    display: inline-block;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    font-size: 15px;
    color: #ffffff;
    background: var(--tinta);
    text-decoration: none;
    padding: 13px 28px;
    border-radius: 3px;
  }
  .boton:hover { background: #0d1730; }
  .nota {
    margin-top: 22px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--tinta-suave);
  }
</style>
</head>
<body>
  <div class="tarjeta">
    <p class="eyebrow">CETis No. 42 — Ignacio López Rayón</p>
    <h1>Captura de Evaluaciones por Actividad</h1>
    <p class="descripcion">
      Docentes: aquí capturas calificaciones, generas concentrados y
      administras grupos.<br>
      Alumnos: aquí consultas tu propio estatus por materia y parcial.
    </p>
    <a class="boton" href="https://script.google.com/a/macros/cetis42.edu.mx/s/AKfycbx56z13rkdqviAz0XGv9-0GQ_cZqAGWjJZ23Z81n2_d9lreNX1FTvVPw0fmPlyfQmRo/exec"" target="_blank" rel="noopener">
      Abrir aplicación
    </a>
    <p class="nota">Entra con tu cuenta de Google institucional</p>
  </div>
</body>
</html>
