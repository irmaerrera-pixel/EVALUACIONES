<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captura de Evaluaciones — CETis 42</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #ffffff;
    --fondo: #f8fafc;
    --papel-linea: #e5e7eb;
    --tinta: #0f172a;
    --tinta-suave: #64748b;
    --esmeralda: #2563eb;
    --esmeralda-oscuro: #1d4ed8;
    --esmeralda-suave: rgba(37, 99, 235, 0.10);
    --sombra: 0 2px 4px rgba(15, 23, 42, 0.08), 0 12px 28px rgba(15, 23, 42, 0.12);
    --serif: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'Roboto Mono', 'SFMono-Regular', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--fondo);
    color: var(--tinta);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    padding: 48px 24px;
  }
  .contenedor {
    max-width: 420px;
    width: 100%;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 32px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12.5px;
    letter-spacing: 0.03em;
    color: var(--tinta-suave);
    margin: 0 0 10px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 27px;
    margin: 0;
    line-height: 1.3;
  }
  .tarjeta {
    background: var(--papel);
    border: 1px solid var(--papel-linea);
    border-radius: 8px;
    box-shadow: var(--sombra);
    padding: 30px 26px;
  }
  .tarjeta h2 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 18px;
    margin: 0 0 10px;
  }
  .tarjeta p {
    font-size: 14px;
    color: var(--tinta-suave);
    line-height: 1.55;
    margin: 0 0 22px;
  }
  .boton {
    display: inline-block;
    width: 100%;
    text-align: center;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 14.5px;
    text-decoration: none;
    padding: 13px 20px;
    border-radius: 6px;
    box-sizing: border-box;
    transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .boton-primario {
    color: #ffffff;
    background: linear-gradient(135deg, var(--esmeralda) 0%, var(--esmeralda-oscuro) 100%);
    box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2), 0 4px 12px rgba(37, 99, 235, 0.22);
  }
  .boton-primario:hover {
    background: linear-gradient(135deg, var(--esmeralda-oscuro) 0%, #1e40af 100%);
    box-shadow: 0 3px 8px rgba(37, 99, 235, 0.28), 0 6px 18px rgba(37, 99, 235, 0.3);
    transform: translateY(-1px);
  }
  .nota {
    margin-top: 16px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--tinta-suave);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="contenedor">
    <header>
      <p class="eyebrow">CETis No. 42 — Ignacio López Rayón</p>
      <h1>Captura de Evaluaciones por Actividad</h1>
    </header>
    <div class="tarjeta">
      <h2>Ya tengo acceso</h2>
      <p>Docentes: capturas calificaciones, generas concentrados y administras grupos. Alumnos: consultas tu propio estatus.</p>
      <a class="boton boton-primario" href="https://script.google.com/a/macros/cetis42.edu.mx/s/AKfycbwIXKZD9DDbrKkZSswvIS2GyDrVJGcYayOGDfpfjBpkoC0j1m-FXFucPuuhhd4MfH4/exec" target="_blank" rel="noopener">Abrir aplicación</a>
      <p class="nota">Entra con tu cuenta de Google institucional</p>
    </div>
  </div>
</body>
</html>
